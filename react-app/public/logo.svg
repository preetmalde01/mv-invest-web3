<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" width="180" height="32" fill="none">
  <style>
    .brand-mark { stroke: #0A0A0A; }
    .brand-dot { fill: #0A0A0A; }
    .brand-text { fill: #0A0A0A; }
    @media (prefers-color-scheme: dark) {
      .brand-mark { stroke: #FFFFFF; }
      .brand-dot { fill: #FFFFFF; }
      .brand-text { fill: #FFFFFF; }
    }
  </style>
  <g transform="translate(0, 4)">
    <circle cx="12" cy="12" r="10" class="brand-mark" stroke-width="2.2" fill="none"/>
    <circle cx="12" cy="12" r="4.5" class="brand-dot"/>
  </g>
  <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" class="brand-text">MV INVEST</text>
</svg>
